name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck, Test & Static Export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build Cloudflare static export
        run: npm run build:cloudflare
        env:
          CLOUDFLARE_SITE_URL: https://kohinoor-hair-salon.pages.dev

      - name: Run verification tests
        run: npm test

  browser:
    name: ${{ matrix.engine }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            engine: chromium
          - os: ubuntu-latest
            engine: firefox
          - os: macos-latest
            engine: webkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Install Linux browser and native dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Install browser
        if: runner.os != 'Linux'
        run: npx playwright install ${{ matrix.engine }}
      - run: npm run test:browser -- --project=${{ matrix.engine }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-traces-${{ matrix.engine }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
